# Environnement conda pour Windows 64 bits, aligné sur le dépôt :
# Python 3.7.4 (requirements.txt) et PyTorch 1.5 (README).
# PyTorch 1.5.0 n'est plus disponible pour Windows sur le canal pytorch ;
# 1.5.1 (version corrective) est la plus proche. Build CPU.
#
# Création :  conda env create -f environment.yml
# Activation : conda activate tdqn
name: tdqn
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.7.4
  - pytorch=1.5.1=py3.7_cpu_0
  - numpy=1.19.2     # minimum demandé par pandas 1.3.5 sur conda
  - pandas=1.3.5
  - scipy
  - matplotlib
  - statsmodels
  - tensorboard
  - requests
  - tqdm
  - pip
  - pip:
      - seaborn
      - tabulate
      - gym==0.17.3
      - pandas-datareader==0.10.0
      - yfinance==0.2.57
      - multitasking==0.0.11   # 0.0.12+ utilise typing.TypedDict (Python 3.8+)
